name: Bug report
description: Report and track a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report a defect in an OMC repository.

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What is actually happening?
      placeholder: Describe the current (incorrect) behavior with steps to reproduce.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: proposed_fix
    attributes:
      label: Proposed fix (optional)
      description: If you have an idea of the fix, sketch it here.
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (data loss, security exposure, production outage)
        - High (broken core feature, no workaround)
        - Medium (degraded feature, workaround exists)
        - Low (cosmetic, minor)
    validations:
      required: true

  - type: checkboxes
    id: security_impact
    attributes:
      label: Security impact
      description: Does this bug have any security implications?
      options:
        - label: Possible vulnerability
        - label: Exposes sensitive data or credentials
        - label: Bypasses an authentication or authorization control
        - label: No security impact
