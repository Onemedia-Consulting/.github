name: Task
description: Track a general task, chore, or improvement
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for general work that is neither a bug nor a feature request.

        Even chores get checkable done-conditions. (Required fields are enforced by GitHub on public
        repos; on private repos this guides but does not hard-block — enforcement tracked separately.)

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Checkable, observable done-conditions. How do we know this task is complete?
      placeholder: |
        - [ ] Config migrated and the old path removed
        - [ ] CI green on the new workflow
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this explicitly does NOT cover.
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Infrastructure
        - Documentation
        - Refactoring
        - Dependency update
        - Security hardening
        - Performance
        - Tooling / CI
        - Other
    validations:
      required: true

  - type: checkboxes
    id: security_considerations
    attributes:
      label: Security considerations
      options:
        - label: Modifies security controls or policies
        - label: Affects access management or secrets
        - label: Modifies authentication or authorization
        - label: No security implications
